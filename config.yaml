  # Add tournament/competition IDs here to auto-watch their UPCOMING + LIVE events.
  # The resolver re-polls these on a schedule and spawns watchers for new fixtures.
  # - 11965   # example: Serie A
  # - 11963   # example: Premier League
# How often to re-poll tournaments while watchers are active (default 86400 = 24h)
refresh_interval_seconds: 86400
# How often to re-poll when no watchers are active (default 600 = 10 min) —
# picks up next-matchday fixtures quickly without spamming the API.
refresh_interval_when_idle_seconds: 600
cadence:
  prematch_seconds: 600
  live_seconds: 90
  # Start sampling at live_seconds this many seconds before kickoff so
  # we don't miss the first 5-15 minutes of in-play while waiting for
  # BetPawa to flip its `live=true` status flag.
  live_lead_seconds: 300
  # Hard timeout on the BP status poll inside one tick. Without this
  # the watcher can hang forever on a stalled BP API — observed 90-min
  # wall-clock gaps around kickoff when BP's API stalls during the
  # live transition.
  poll_timeout_seconds: 30
  # Hard timeout on the resolver+collector path. Higher than the
  # status poll because the resolver lazily builds per-tournament
  # prematch event maps for SB/B9J/BW on the first call. At startup
  # with 100+ watchers racing to resolve at once the map builds
  # queue up; 90s lets that settle without sentinels cascading.
  resolver_timeout_seconds: 90
  status_retry_backoff_seconds: [5, 15, 45]
  watchdog_after_kickoff_seconds: 10800
output:
  db_path: data/odds.db
  resolution_cache_path: data/resolution_cache.json
log_level: INFO
# Soft cap on concurrent watchers. Priority IDs (events + tournaments)
# always spawn and consume cap headroom; non-priority (global-sweep)
# IDs spawn only while there's room.
max_active_watchers: 500
# Global BP football sweep: scrapes every UPCOMING + LIVE event BP lists
# under sport_id="2", in addition to the priority lists above.
global_sweep:
  enabled: true
  sport_id: "2"
  event_types: [UPCOMING, LIVE]
