{% for event in events %}
  {% include "_event_card.html" %}
{% endfor %}
{% if has_more %}
<div class="scroll-sentinel"
     hx-get="/events?status={{ status }}&offset={{ offset + limit }}&limit={{ limit }}&country={{ country }}&league={{ league }}&date_from={{ date_from }}&date_to={{ date_to }}"
     hx-trigger="revealed"
     hx-swap="outerHTML">
</div>
{% endif %}
