{% extends "base.html" %}
{% block content %}
<div class="p-3 max-w-screen-2xl mx-auto">
  <div class="flex justify-between border-b border-gray-900 pb-3 mb-3">
    <div class="text-white font-semibold tracking-wider">ODDS · LIVE COMPARISON</div>
    <div class="flex gap-1" id="tabs">
      {% set s = initial_status or 'upcoming' %}
      <button class="tab{% if s == 'live' %} active{% endif %}" data-status="live">LIVE</button>
      <button class="tab{% if s == 'upcoming' %} active{% endif %}" data-status="upcoming">UPCOMING</button>
      <button class="tab{% if s == 'ended' %} active{% endif %}" data-status="ended">ENDED</button>
      <a class="tab" href="/simulator" style="margin-left:12px;color:#fbbf24">SIMULATOR →</a>
      <a class="tab" href="/export" style="margin-left:12px;color:#fbbf24">EXPORT →</a>
    </div>
  </div>

  <div class="filter-row">
    <div class="filter-group">
      <span class="filter-lbl">Country</span>
      <select id="country-select" class="filter-select">
        <option value="">All</option>
        {% for c in country_league_index %}
          <option value="{{ c.country_id }}">{{ c.country_name }}</option>
        {% endfor %}
      </select>
      <span class="filter-lbl">League</span>
      <select id="league-select" class="filter-select" disabled>
        <option value="">All</option>
      </select>
    </div>

    <div class="filter-group">
      <span class="filter-lbl">Bookmakers</span>
      <button class="chip on" data-bookmaker="betpawa">BP</button>
      <button class="chip on" data-bookmaker="sportybet">SB</button>
      <button class="chip on" data-bookmaker="bet9ja">B9J</button>
      <button class="chip on" data-bookmaker="betway">BW</button>
    </div>

    <div class="filter-group filter-kickoff">
      <span class="filter-lbl">Kickoff</span>
      <button class="chip kick on" data-window="all">All</button>
      <button class="chip kick"    data-window="3600">1h</button>
      <button class="chip kick"    data-window="10800">3h</button>
      <button class="chip kick"    data-window="21600">6h</button>
      <button class="chip kick"    data-window="86400">24h</button>
      <button class="chip kick"    data-window="172800">48h</button>
      <input type="date" id="kickoff-date" class="custom-hours"
             title="Show only events kicking off on this day (local time)">
    </div>

    <div class="filter-group filter-sort">
      <span class="filter-lbl">Sort</span>
      <button class="chip sort on" data-sort="minute_desc">Minute &darr;</button>
      <button class="chip sort"    data-sort="minute_asc">Minute &uarr;</button>
      <button class="chip sort"    data-sort="goals_desc">Goals &darr;</button>
      <button class="chip sort"    data-sort="goals_asc">Goals &uarr;</button>
    </div>

    <div class="filter-group filter-search">
      <span class="filter-lbl">Search</span>
      <input type="search"
             id="search-input"
             class="search-input"
             placeholder="team name..."
             autocomplete="off">
    </div>

    <div class="filter-group filter-date-range">
      <span class="filter-lbl">From</span>
      <input type="date" id="date-from" class="date-input"
             min="{{ date_range.min }}" max="{{ date_range.max }}">
      <span class="filter-lbl">To</span>
      <input type="date" id="date-to" class="date-input"
             min="{{ date_range.min }}" max="{{ date_range.max }}">
    </div>
  </div>

  <script type="application/json" id="country-league-index">
  {
    "items": [
      {% for c in country_league_index %}
        {
          "country_id":   {{ c.country_id|tojson }},
          "country_name": {{ c.country_name|tojson }},
          "leagues": [
            {% for l in c.leagues %}
              {"league_id": {{ l.league_id|tojson }}, "league_name": {{ l.league_name|tojson }}}{% if not loop.last %},{% endif %}
            {% endfor %}
          ]
        }{% if not loop.last %},{% endif %}
      {% endfor %}
    ]
  }
  </script>

  <div id="events-list"
       hx-get="/events?status={{ initial_status or 'upcoming' }}"
       hx-trigger="load"
       hx-swap="outerHTML">
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/app.js"></script>
{% endblock %}
