<div id="events-list"
     hx-get="/events?status={{ status }}{% if open_ids %}&open={{ open_ids|join(',') }}{% endif %}"
     hx-trigger="every {{ poll_seconds }}s"
     hx-swap="outerHTML"
     data-status="{{ status }}"
     data-open="{{ open_ids|join(',') }}">
  {% for event in events %}
    {% include "_event_card.html" %}
  {% endfor %}
</div>
