{% extends "base.html" %}
{% block content %}
<div class="p-3 max-w-screen-2xl mx-auto" data-page-title="Edit Pricer Profile">
  <div class="flex justify-between border-b border-gray-900 pb-3 mb-3">
    <div class="text-white font-semibold tracking-wider" title="Edit Pricer Profile">PRICER SIMULATOR</div>
    <div class="flex gap-1">
      <a class="tab" href="/simulator">RUNS</a>
      <a class="tab active" href="/simulator/profiles">PROFILES</a>
      <a class="tab" href="/" style="margin-left:12px">← back to events</a>
    </div>
  </div>

  <div class="sim-section">
    <div class="sim-section-h">Edit profile <span class="filter-lbl">(custom · created {{ profile.created_at }})</span></div>
    <form method="post" action="/simulator/profiles/{{ profile.id }}" class="sim-form">
      <div class="filter-group">
        <span class="filter-lbl">Profile name</span>
        <input class="search-input" type="text" name="name" required
               value="{{ profile.name }}" autocomplete="off">
      </div>

      {% set coeffs = profile.coefficients %}
      {% include "_profile_fields.html" %}

      <div style="margin-top:12px;display:flex;gap:8px">
        <button type="submit" class="chip on" style="padding:6px 16px;cursor:pointer">
          Save changes
        </button>
        <a href="/simulator/profiles" class="chip"
           style="padding:6px 16px;text-decoration:none;color:#d1d5db;border:1px solid #1a1a1a">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>

<style>
  .sim-section { margin: 14px 0; padding: 10px; background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 4px; }
  .sim-section-h { color: #fbbf24; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
</style>
{% endblock %}
